<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Racing! 1 – ลากบล็อก Flowchart ให้รถวิ่ง</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#a98bc9;--card:#f6f3fa;--tx:#2a1650;--pu:#6b3fa0;--pl:#e3d8f1;--ok:#17894b;--bad:#d93636;--blue:#1565c0;--org:#d9660b;--grn:#b9d836;--yel:#ffd84d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1330;--card:#2a1e42;--tx:#f1eaff;--pu:#b58bf0;--pl:#40305f;--ok:#4cd68a;--bad:#ff7a7a;--blue:#7fb8ff;--org:#ffa45c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1330;--card:#2a1e42;--tx:#f1eaff;--pu:#b58bf0;--pl:#40305f;--ok:#4cd68a;--bad:#ff7a7a;--blue:#7fb8ff;--org:#ffa45c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt','Sarabun',system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:1100px;padding:12px}
h1{color:#fff;font-size:1.3rem;text-align:center;margin:4px 0 10px}
h2{font-size:1rem;margin:4px 0 8px}
.wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
section{background:var(--card);border-radius:20px;padding:12px}
#cv{width:100%;height:400px;border-radius:14px;overflow:hidden;background:#9fd3ff}
@media (max-width:820px){#cv{height:300px}}
button{font:inherit;color:var(--tx);cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar button,.clr{background:var(--pu);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:600}
.bar #rs,.bar #cm,.clr{background:var(--pl);color:var(--tx)}
#msg{margin-top:10px;font-weight:600;min-height:2.6em}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
#pal{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.blk{border:2px solid var(--tx);border-radius:8px;padding:7px 10px;background:var(--card);display:flex;align-items:center;gap:6px;font-size:.9rem;user-select:none;cursor:grab}
.blk.F{border-color:var(--blue)}.blk.R,.blk.L{border-color:var(--org)}.blk.W,.blk.S{border-color:var(--ok)}
.blk.on{background:var(--yel);color:#2a1650}
.blk input{width:52px;font:inherit;padding:2px 4px;border-radius:6px;border:1px solid var(--pu);background:var(--card);color:var(--tx)}
.blk .x{margin-left:auto;background:none;border:0;color:var(--bad);font-weight:700}
#ws{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:200px;padding:8px;border:2px dashed var(--pu);border-radius:14px}
#ws .blk{width:230px}
.tm{border:2px solid var(--tx);border-radius:22px;padding:5px 20px;font-weight:600}
.ar{line-height:1;opacity:.7}
.hint{font-size:.8rem;opacity:.8;margin:6px 0}
</style>
</head>
<body>
<main>
<h1>🏎️ Racing! 1 – ลากบล็อก Flowchart ให้รถวิ่ง 3D</h1>
<div class="wrap">
<section>
<div id="cv"></div>
<div class="bar"><button id="run">▶ Run</button><button id="rs">⟲ Reset</button><button id="cm">🎥 เปลี่ยนมุมมอง</button></div>
<div id="msg">ภารกิจ: ดูป้ายระยะ ป้ายเลี้ยว และแผ่นสีบนสนาม แล้วต่อบล็อกให้รถวิ่งจาก START ไปจนถึงแผ่นสีเหลืองมุมซ้ายบน</div>
</section>
<section>
<h2>1) บล็อกคำสั่ง <small>(ลากไปวาง หรือกดเพื่อเพิ่มต่อท้าย)</small></h2>
<div id="pal"></div>
<h2>2) ผังงานของฉัน <small>(ลากบล็อกเพื่อสลับลำดับ)</small></h2>
<div id="ws"></div>
<div class="hint">ช่องตัวเลขของ forward( ) คือระยะทางเป็น CM</div>
<button class="clr" id="clr">🗑 ล้างทั้งหมด</button>
</section>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const BL={F:'forward( )',R:'turn_right( )',L:'turn_left( )',W:'Stop 5 sec',S:'Spin 1 round'};
const TG=[['F',20],['R'],['F',50],['L'],['F',15],['W'],['F',15],['L'],['F',45],['S']];
let prog=[],running=false,chase=false;
const S={x:0,y:0,h:0};
/* ---------- 3D ---------- */
let scene,cam,rend,car;
function init3d(){
 const box=$('cv');
 try{rend=new THREE.WebGLRenderer({antialias:true})}catch(e){box.innerHTML='<p style="padding:20px">อุปกรณ์นี้ไม่รองรับ 3D (WebGL)</p>';return false}
 box.appendChild(rend.domElement);
 scene=new THREE.Scene();scene.background=new THREE.Color(0x9fd3ff);
 cam=new THREE.PerspectiveCamera(50,1,1,500);
 scene.add(new THREE.AmbientLight(0xffffff,.75));
 const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(30,80,40);scene.add(dl);
 const M=c=>new THREE.MeshLambertMaterial({color:c});
 const add=(g,c,x,y,z)=>{const o=new THREE.Mesh(g,M(c));o.position.set(x,y,z);scene.add(o);return o};
 add(new THREE.BoxGeometry(200,1,200),0x8fd16b,30,-.5,-30);
 const road=(x1,y1,x2,y2)=>{const h=y1==y2,L=Math.hypot(x2-x1,y2-y1)+8;add(new THREE.BoxGeometry(h?L:8,.4,h?8:L),0x7a2e3a,(x1+x2)/2,.2,-(y1+y2)/2)};
 road(0,-3,0,20);road(0,20,50,20);road(50,20,50,50);road(50,50,5,50);
 const pad=(x,y,w,d,c)=>add(new THREE.BoxGeometry(w,.2,d),c,x,.5,-y);
 pad(0,20,8,3,0xff69c8);pad(50,20,3,8,0xff69c8);pad(50,50,3,8,0xff69c8);
 pad(50,35,8,10,0xfff27a);pad(5,50,10,10,0xfff27a);
 const lab=(t,x,y)=>{const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='rgba(255,255,255,.88)';g.fillRect(0,0,256,64);g.fillStyle='#2a1650';g.font='bold 30px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,128,32);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));sp.scale.set(18,4.5,1);sp.position.set(x,7,-y);scene.add(sp)};
 lab('START',12,-3);lab('20 CM',-13,10);lab('turn_right( )',-14,24);lab('50 CM',25,28);lab('turn_left( )',66,14);
 lab('15 CM',63,27);lab('Stop 5 sec',69,35);lab('15 CM',63,43);lab('turn_left( )',66,56);lab('45 CM',27,58);lab('Spin 1 round',5,63);
 car=new THREE.Group();
 const m=(g,c,x,y,z)=>{const o=new THREE.Mesh(g,M(c));o.position.set(x,y,z);car.add(o);return o};
 m(new THREE.BoxGeometry(5,2,9),0xff3b1f,0,1.6,0);m(new THREE.BoxGeometry(4,1.6,4),0x222a3a,0,3.2,1);m(new THREE.BoxGeometry(3,.6,1),0xffffff,0,2.7,-4.6);
 [[-2.8,-3],[2.8,-3],[-2.8,3],[2.8,3]].forEach(([x,z])=>{m(new THREE.CylinderGeometry(1.2,1.2,1,12),0x111111,x,1.2,z).rotation.z=Math.PI/2});
 scene.add(car);place();size();setCam(true);
 addEventListener('resize',size);
 (function loop(){requestAnimationFrame(loop);if(chase)chaseCam();rend.render(scene,cam)})();
 return true;
}
function size(){const b=$('cv'),w=b.clientWidth,h=b.clientHeight;rend.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();if(!chase)setCam(true)}
function setCam(top){const a=cam.aspect,k=Math.max(1,1.5/a);cam.position.set(30,80*k,40+(k-1)*30);cam.lookAt(30,0,-28)}
function chaseCam(){const dx=Math.sin(S.h),dz=-Math.cos(S.h);const t=new THREE.Vector3(S.x-dx*26,20,-S.y-dz*26);cam.position.lerp(t,.12);cam.lookAt(S.x,0,-S.y)}
function place(){car.position.set(S.x,0,-S.y);car.rotation.y=-S.h}
/* ---------- animation ---------- */
const tw=(ms,fn)=>new Promise(r=>{const t0=performance.now();(function f(n){const t=Math.min(1,(n-t0)/ms);fn(t);place();t<1?requestAnimationFrame(f):r()})(t0)});
async function exec(b){
 const x0=S.x,y0=S.y,h0=S.h;
 if(b.k=='F'){const d=Math.max(0,+b.v||0);await tw(Math.max(50,d*25),t=>{S.x=x0+Math.sin(h0)*d*t;S.y=y0+Math.cos(h0)*d*t})}
 else if(b.k=='R')await tw(600,t=>{S.h=h0+Math.PI/2*t});
 else if(b.k=='L')await tw(600,t=>{S.h=h0-Math.PI/2*t});
 else if(b.k=='S')await tw(1300,t=>{S.h=h0+Math.PI*2*t});
 else if(b.k=='W')await tw(5000,t=>{$('msg').className='';$('msg').textContent='⏳ รถหยุดรอ… '+Math.ceil(5-5*t)+' วินาที'});
}
function reset(){S.x=0;S.y=0;S.h=0;place()}
async function run(){
 if(running)return;if(!prog.length){say('ยังไม่มีบล็อกเลย ลากบล็อกมาวางก่อนนะ','bad');return}
 reset();running=true;say('รถกำลังวิ่ง…','');
 for(let i=0;i<prog.length;i++){hl(i);await exec(prog[i])}
 hl(-1);running=false;check();
}
function say(t,c){$('msg').className=c||'';$('msg').textContent=t}
function check(){
 const n=Math.max(TG.length,prog.length);
 for(let i=0;i<n;i++){const a=prog[i],g=TG[i];
  if(!g)return say(`🤔 มีบล็อกเกินมา เริ่มตั้งแต่ขั้นที่ ${i+1} ลองดูว่ารถถึงปลายทางแล้วหรือยัง`,'bad');
  if(!a)return say(`🤔 ยังขาดบล็อกต่อจากขั้นที่ ${i} รถยังไปไม่ถึงปลายทาง`,'bad');
  if(a.k!=g[0])return say(`🤔 ขั้นที่ ${i+1} ยังไม่ตรงกับสนาม ลองดูป้ายและแผ่นสีตรงจุดนั้นอีกครั้ง`,'bad');
  if(g[1]&&Math.abs(a.v-g[1])>2)return say(`📏 ขั้นที่ ${i+1} ระยะทางยังไม่ตรงกับป้ายบนสนาม`,'bad')}
 say('🏁 สำเร็จ! ผังงานของคุณพารถวิ่งครบเส้นทาง Racing! 1 เก่งมาก 🎉','ok');
}
/* ---------- flowchart editor ---------- */
function blk(k,v,i){
 const inp=k=='F'?`<input type="number" min="1" max="99" value="${v}" data-i="${i}"> CM`:'';
 return `<div class="blk ${k}" draggable="true" data-i="${i}">${BL[k]}${inp}<button class="x" data-x="${i}" aria-label="ลบ">✕</button></div>`;
}
function draw(){
 $('ws').innerHTML=`<span class="tm">Start</span>`+prog.map((b,i)=>`<span class="ar">↓</span>${blk(b.k,b.v,i)}`).join('')+`<span class="ar">↓</span><span class="tm">End</span>`;
}
function hl(i){document.querySelectorAll('#ws .blk').forEach(e=>e.classList.toggle('on',+e.dataset.i===i))}
$('pal').innerHTML=Object.keys(BL).map(k=>`<div class="blk ${k}" draggable="true" data-k="${k}">${BL[k]}</div>`).join('');
const mk=k=>({k,v:k=='F'?20:0});
$('pal').onclick=e=>{const b=e.target.closest('.blk');if(b&&!running){prog.push(mk(b.dataset.k));draw()}};
$('pal').ondragstart=e=>e.dataTransfer.setData('text/plain','new:'+e.target.closest('.blk').dataset.k);
$('ws').ondragstart=e=>{const b=e.target.closest('.blk');if(b)e.dataTransfer.setData('text/plain','mv:'+b.dataset.i)};
$('ws').ondragover=e=>e.preventDefault();
$('ws').ondrop=e=>{
 e.preventDefault();if(running)return;
 const d=e.dataTransfer.getData('text/plain').split(':'),t=e.target.closest('.blk');
 let at=t?+t.dataset.i:prog.length;
 if(d[0]=='new')prog.splice(at,0,mk(d[1]));
 else if(d[0]=='mv'){const j=+d[1],[b]=prog.splice(j,1);if(j<at)at--;prog.splice(at,0,b)}
 draw();
};
$('ws').onclick=e=>{const x=e.target.closest('[data-x]');if(x&&!running){prog.splice(+x.dataset.x,1);draw()}};
$('ws').oninput=e=>{if(e.target.dataset.i!==undefined)prog[+e.target.dataset.i].v=+e.target.value};
$('clr').onclick=()=>{if(!running){prog=[];draw()}};
$('run').onclick=run;
$('rs').onclick=()=>{if(!running){reset();say('รีเซ็ตรถที่จุด START แล้ว','')}};
$('cm').onclick=()=>{chase=!chase;if(!chase)setCam(true)};
draw();init3d();
</script>
</body>
</html>
